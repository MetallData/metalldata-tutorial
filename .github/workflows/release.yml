name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/metalldata-tutorial

jobs:
  # Build, test, and push one single-arch image per platform on a native runner
  # (emulating the C++ build under QEMU would take hours).
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read metalldata pin
        id: pin
        run: echo "ref=$(cat METALLDATA_REF)" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            METALLDATA_REF=${{ steps.pin.outputs.ref }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.metalldata.ref=${{ steps.pin.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Execute notebooks
        run: |
          mkdir -p build && chmod 777 build
          docker run --rm -v "$PWD:/work" -w /work -e TUTORIAL_DATA=/work/data \
            "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}" bash scripts/run-notebooks.sh

      - name: Push single-arch image
        run: docker push "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-${{ matrix.arch }}
          path: build/*.ipynb

  # Combine the per-arch images into one multi-arch tag, then publish the release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read metalldata pin
        id: pin
        run: echo "ref=$(cat METALLDATA_REF)" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:latest" \
            "$IMAGE:${{ github.ref_name }}-amd64" \
            "$IMAGE:${{ github.ref_name }}-arm64"
          docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}"

      - uses: actions/download-artifact@v4
        with:
          name: executed-notebooks-amd64
          path: build

      - name: Package release assets
        run: |
          tar czf notebooks-${{ github.ref_name }}.tar.gz build/*.ipynb notebooks/*.md
          cat > release-notes.md <<EOF
          metalldata ref: \`${{ steps.pin.outputs.ref }}\`

          Run the tutorial (Windows, macOS, or Linux; amd64 and arm64):

          \`\`\`bash
          docker run --rm -p 8888:8888 $IMAGE:${{ github.ref_name }}
          \`\`\`

          Assets: executed notebooks (\`.ipynb\`), MyST sources (\`.md\`),
          \`requirements.txt\` and \`env.sh\` for running against your own
          metalldata build.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            notebooks-${{ github.ref_name }}.tar.gz build/*.ipynb requirements.txt env.sh
